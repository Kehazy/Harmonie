name: Bug report
description: Something looks wrong or the app does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A screenshot of Spotify helps a lot.
    validations:
      required: true
  - type: input
    id: spotify
    attributes:
      label: Spotify version
      description: In Spotify, open the menu, then Help > About Spotify.
      placeholder: "1.2.50.335"
    validations:
      required: true
  - type: input
    id: spicetify
    attributes:
      label: Spicetify version
      description: Run `spicetify -v`.
      placeholder: "2.46.4"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you install Spotify from?
      options:
        - spotify.com
        - Microsoft Store
        - Other
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How did you install Harmonie?
      options:
        - Harmonie app
        - Spicetify Marketplace
        - By hand
    validations:
      required: true
