[package]
name = "harmonie"
version = "3.3.0"
description = "Installs the Harmonie theme (Apple Music-inspired) on Spotify through Spicetify"
license = "MIT"
repository = "https://github.com/Kehazy/harmonie"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
